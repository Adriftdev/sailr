# Configure the external CircleCI schedule named production-release with cron/branch
# metadata and set pipeline parameter sailr_production_release_enabled=true.
parameters:
  sailr_production_release_enabled:
    type: boolean
    default: false
workflows:
  production-release:
    when: pipeline.parameters.sailr_production_release_enabled
    jobs:
      - release-plan-job
      - release-approval-job:
          requires:
            - release-plan-job
      - signed-deploy-job:
          requires:
            - release-approval-job
      - release-verification-job:
          requires:
            - signed-deploy-job
