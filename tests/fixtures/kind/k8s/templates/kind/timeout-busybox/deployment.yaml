apiVersion: apps/v1
kind: Deployment
metadata:
  name: sailr-timeout-busybox
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sailr-timeout-busybox
  template:
    metadata:
      labels:
        app: sailr-timeout-busybox
    spec:
      containers:
        - name: busybox
          image: "{{service_image}}"
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c", "sleep 3600"]
